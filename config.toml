baseURL = "/"
languageCode = "en-uk"
theme = "hugo-winston-theme"
themesDir = "themes"
title = "HJ Strength Coaching | Newcastle Powerlifting Coach"
enableRobotsTXT = true
pagination.pagerSize = 3
pygmentsCodeFences = true
pygmentsCodefencesGuessSyntax = true
pygmentsUseClasses = true

[module]
  [module.hugoVersion]
    extended = true
    min = "0.55.0"

[params]
  google_analytics_id = ""
  instagram_handle = ""
  showAuthorOnHomepage = true
  showAuthorOnPosts = false
  showIntroContentOnHomepage = true
  showPostsOnHomepage = false
  usePaginationOnHomepage = false
  limitPostsOnHomepage = 3 # only used if usePaginationOnHomepage is false
  sortPostsByDateOldestFirst = false
  addDot = true
  addFrame = true
  highlightColor = '#FF5964'
  baseColor = "#ffffff"
  baseOffsetColor = "#eaeaea"
  headingColor = "#1c1b1d"
  textColor = "#4e5157"
  dotColor = "#FF5964"
  enableGoogleFonts = true
  # Refresh: League Spartan (headings) + Jost (body, stands in for Glacial Indifference)
  googleFontsUrl = "https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
  fontFamilyHeading = "'League Spartan', 'Arial Narrow', sans-serif"
  fontFamilyParagraph = "'Jost', 'Helvetica Neue', Arial, sans-serif"
  fontFamilyMonospace = "'Jost', monospace"

[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

# markdown config settings https://gohugo.io/getting-started/configuration-markup/#goldmark
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      hardWraps = false
      unsafe = true
      xhtml = false

[menu]
  [[menu.main]]
    identifier = 'home'
    name = 'Home'
    url = '/'
    weight = 1
  [[menu.main]]
    name = "About"
    identifier = "about"
    weight = 2
    url = "/about/"
  [[menu.main]]
    name = "Services"
    identifier = "services"
    weight = 3
    url = "/services/"
  [[menu.main]]
    name = "Posts"
    identifier = "posts"
    weight = 4
    url = "/posts/"
  [[menu.main]]
    name = "Contact"
    identifier = "contact"
    weight = 5
    url = "/contact/"
